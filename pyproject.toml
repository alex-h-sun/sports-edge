[project]
name = "sports-edge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nba_api",
    "requests",
    "polars",
    "lightgbm",
    "scikit-learn",
    "numpy",
    "pyarrow",
    "python-dotenv",
    "streamlit",
    "tqdm",
]

[project.optional-dependencies]
dev = ["jupyter", "matplotlib", "seaborn", "ipykernel", "pytest", "httpx"]
# Heavy ML deps for the tennis model bake-off (compare.py). Intended for the
# cloud (Colab GPU) tier only — the core local install never needs these.
tennis = ["torch", "xgboost"]
# Web app serving tier (webapp/). Built on Starlette (no FastAPI/pydantic needed);
# scipy backs edge.calculator, boto3 is only used for s3:// snapshot sync.
serve = ["starlette", "uvicorn[standard]", "itsdangerous", "boto3", "scipy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["edge*", "features*", "models*", "ingestion*", "webapp*"]
