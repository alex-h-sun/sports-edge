[project]
name = "sports-edge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nba_api",
    "requests",
    "polars",
    "lightgbm",
    "scikit-learn",
    "numpy",
    "pyarrow",
    "python-dotenv",
    "streamlit",
    "tqdm",
]

[project.optional-dependencies]
dev = ["jupyter", "matplotlib", "seaborn", "ipykernel"]

[tool.setuptools.packages.find]
where = ["."]
